[project]
name = "costio"
version = "1.0.16"
description = "Smart expense tracker with shared workspaces and budgeting."
requires-python = ">=3.10"

dependencies = [
    "flet==0.84.0",
    "flet-charts==0.84.0",
    "tzdata",
    "requests>=2.30.0",
    "python-dotenv>=1.0.0",
    "openai>=2.0.0",
    "supabase>=2.0.0",
    "sounddevice",
    "soundfile",
    "numpy",
    "ofxparse",
]

[tool.flet]
org = "com.pps"
product = "Costio"
permissions = ["microphone"]
build_number = 18