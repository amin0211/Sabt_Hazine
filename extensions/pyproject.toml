[project]
name = "costio-ios-voice"
version = "0.1.0"
description = "CostioIosVoice control for Flet"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Flet contributors", email = "you@example.com" }
]
dependencies = [
    "flet>=0.84.0",
]

[dependency-groups]
dev = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]"
]

[project.urls]
Homepage = "https://mydomain.dev"
Documentation = "https://github.com/MyGithubAccount/costio-ios-voice"
Repository = "https://github.com/MyGithubAccount/costio-ios-voice"
Issues = "https://github.com/MyGithubAccount/costio-ios-voice/issues"

[tool.setuptools.package-data]
"flutter.costio_ios_voice" = ["**/*"]

[tool.setuptools]
license-files = []

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
